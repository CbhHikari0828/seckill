version: '3.8'

services:
  # ==========================================
  # 秒杀系统的 MySQL 数据库服务
  # ==========================================
  seckill-db:
    image: mysql:8.0
    container_name: seckill_mysql_container
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seckill_db
      TZ: Asia/Shanghai
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
    volumes:
      - seckill-mysql-data:/var/lib/mysql


  # ==========================================
  # 秒杀系统 Redis 缓存服务
  # ==========================================
  seckill-redis:
    image: redis:7.2.3
    container_name: seckill_redis_container
    restart: always
    ports:
      - "6380:6379"
    environment:
      TZ: Asia/Shanghai
    command:
      redis-server
      --requirepass qwe123!@#
      --appendonly yes
    volumes:
      # 持久化 Redis 数据
      - seckill-redis-data:/data


# ==========================================
# 数据卷声明
# ==========================================
volumes:
  seckill-mysql-data:
  seckill-redis-data: