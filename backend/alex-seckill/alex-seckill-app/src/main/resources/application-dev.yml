spring:
  # 本地开发环境 MySQL 数据源配置
  datasource:
    # 连接地址：数据库名为 xiaoha_seckill（1.1 小节中创建的）
    url: jdbc:mysql://localhost:3308/seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # 数据库用户名
    username: root
    # 数据库密码
    password: root
    # 数据库驱动类名
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置
    hikari:
      # 连接池名称
      pool-name: SeckillHikariPool
      # 最小空闲连接数
      minimum-idle: 10
      # 最大连接数
      maximum-pool-size: 50
      # 空闲连接超时时间（毫秒）
      idle-timeout: 300000
      # 连接最大存活时间（毫秒）
      max-lifetime: 900000
      # 获取连接超时时间（毫秒）
      connection-timeout: 30000
      # 连接测试语句
      connection-test-query: SELECT 1
    # Redis 配置
  data:
    redis:
      # Redis 服务器地址
      host: localhost
      # Redis 服务器端口
      port: 6380
      # Redis 密码（默认为空，如果设置了密码请填写）
      password: qwe123!@#
      # 使用的数据库索引（默认 0）
      database: 0
      # 连接超时时间（毫秒）
      timeout: 5000
      # Lettuce 连接池配置（提升连接复用效率）
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 20
          # 连接池最大空闲连接数
          max-idle: 10
          # 连接池最小空闲连接数
          min-idle: 5
          # 连接池最大阻塞等待时间（毫秒），-1 表示无限制
          max-wait: 3000
  rabbitmq: # RabbitMQ 配置
    host: 127.0.0.1 # RabbitMQ 服务器地址
    port: 5672 # AMQP 协议端口
    username: seckill # 用户名
    password: qwe123!@# # 密码
    virtual-host: /seckill # 虚拟主机
    connection-timeout: 15000 # 连接超时时间（毫秒）
    listener:
      simple:
        prefetch: 5
        acknowledge-mode: manual # 手动 ACK
    publisher-confirm-type: correlated # 开启生产者 Confirm，消息到达交换机后回调确认
    publisher-returns: true # 开启 Return，消息无法路由到队列时回调退回
    template:
      mandatory: true # 配合 Return 使用，无法路由时不静默丢弃消息

############## Sa-Token 配置 ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # token 前缀
  token-prefix: Bearer
############## 行为验证码配置 ##############
captcha:
  # 如果项目中使用到了 Redis，滑块验证码会自动把验证码数据存到 Redis 中， 这里配置 Redis 的 key 的前缀,默认是 captcha:slider
  prefix: captcha
  expire: # 验证码过期时间，默认是2分钟,单位毫秒， 可以根据自身业务进行调整
    default: 10000 # 默认缓存时间 2分钟
    WORD_IMAGE_CLICK: 20000 # 针对 点选验证码 过期时间设置为 2分钟， 因为点选验证码验证比较慢，把过期时间调整大一些
  secondary:
    enabled: true # 二次验证，开启后支持在登录时进行验证码二次校验
    expire: 120000 # 二次验证过期时间，默认 2 分钟
    keyPrefix: "captcha:secondary" # 二次验证缓存 Key 前缀
  # 初始化默认模板资源（滑块形状等）
  init-default-resource: true
  # 缓存控制， 默认为 false 不开启
  local-cache-enabled: true
  # 验证码会提前缓存一些生成好的验证数据， 默认是 20
  local-cache-size: 20

# 自定义线程池配置
thread-pool:
  # 核心线程数
  core-pool-size: 2
  # 最大线程数
  max-pool-size: 5
  # 队列容量
  queue-capacity: 100
  # 空闲线程存活时间（秒）
  keep-alive-seconds: 60

# MyBatis 开发环境专属配置
mybatis:
  configuration:
    # 开发阶段打印 SQL 语句，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
